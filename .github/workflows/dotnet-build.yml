name: .NET build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Konekto.sln
      - name: Build
        run: dotnet build Konekto.sln --configuration Release --no-restore
