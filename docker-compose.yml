services:
  # ==========================================
  # 1. Konekto Backend API Service
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: konekto_api
    ports:
      - "${PORT:-5100}:8080"
      - "3000:8080" # Supporting slide demo port
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Server=${DB_HOST:-db};Database=${DB_NAME:-KonektoDb};User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-Your_strong_password123!};TrustServerCertificate=True;
      - Jwt__Secret=${JWT_SECRET:-super_secret_konekto_alumni_jwt_key_2026_secure_minimum_32_chars!}
    depends_on:
      - db
    restart: unless-stopped

  # ==========================================
  # 2. Database Service (MS SQL Server)
  # ==========================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: konekto_db
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-Your_strong_password123!}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      # Data Persistence: Solves "The Forgetting Test" by persisting DB files across down/up
      - mssql_data:/var/opt/mssql/data
    restart: unless-stopped

# ==========================================
# 3. Persistent Volumes
# ==========================================
# Named volume guarantees data survives `docker compose down` and `docker compose up`
volumes:
  mssql_data:
    driver: local
